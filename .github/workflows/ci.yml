name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Make Scripts Executable
        run: chmod +x scripts/*.sh app/*.sh tests/*.sh
      - name: Run Linting
        run: ./scripts/lint.sh

  test:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Make Scripts Executable
        run: chmod +x scripts/*.sh app/*.sh tests/*.sh

      - name: Run Application Tests
        run: ./tests/test.sh

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Make Scripts Executable
        run: chmod +x scripts/*.sh app/*.sh tests/*.sh

      - name: Build and Smoke Test Docker Image
        run: ./scripts/build.sh
